# Synthetic Data Generation Configuration
# Fixed global seed ensures bit-for-bit reproducibility across runs
seed: 20261022
currency: INR
year: 2026

# Active generation profile: starter | medium | full
# starter: 200 applicants, 120 applications (quick validation / tests)
# medium: 2,000 applicants, 1,200 applications (integration)
# full: 10,000 applicants, 6,000 applications (master target)
active_profile: starter

profiles:
  starter:
    applicant_count: 200
    application_count: 120
    loan_product_count: 4
    anomaly_count: 25
  medium:
    applicant_count: 2000
    application_count: 1200
    loan_product_count: 4
    anomaly_count: 100
  full:
    applicant_count: 10000
    application_count: 6000
    loan_product_count: 4
    anomaly_count: 300

# Distribution benchmarks
distributions:
  credit_score:
    mean: 710
    std: 75
    min: 300
    max: 900
  employment_type_weights:
    SALARIED: 0.65
    SELF_EMPLOYED: 0.25
    FREELANCE: 0.07
    UNEMPLOYED: 0.03
  loan_approval_target:
    approved: 0.58
    rejected: 0.24
    manual_review: 0.14
    pending_info: 0.04

# Anomaly distribution across 5 mandatory categories
anomalies:
  invalid_term_ratio: 0.20
  schedule_reconciliation_ratio: 0.20
  decision_before_checks_ratio: 0.20
  income_conflict_ratio: 0.20
  duplicate_disbursement_ratio: 0.20

# Export paths
export:
  csv_dir: data/exports/csv
  json_dir: data/exports/json
  sql_dir: data/exports/sql
  ground_truth_csv: data/ground_truth.csv
  ground_truth_json: data/ground_truth.json

